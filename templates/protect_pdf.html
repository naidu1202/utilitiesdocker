{% extends "base.html" %}

{% block title %}
Protect PDF
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>🔒 Protect PDF</h1>

<form action="/protect-pdf"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="file"
       required>

<br><br>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<br><br>

<button type="submit">
Protect PDF
</button>

</form>

</div>

{% endblock %}
