<!DOCTYPE html>
<html>
<head>
<title>Protect PDF</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">

       placeholder="Password"

<button type="submit">
Protect PDF
</button>

</form>

</div>

</body>
</html>
