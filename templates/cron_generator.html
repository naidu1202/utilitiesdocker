<!DOCTYPE html>
<html>
<head>
    <title>Cron Expression Generator | UtilitiesDocker</title>

    <link rel="stylesheet" href="/static/style.css">

    <meta
        name="description"
        content="Generate cron expressions for Linux cron jobs online."
    >

    <style>
        body{
            background:#f5f7fb;
            font-family:Segoe UI,sans-serif;
        }

        .cron-card{
            background:white;
            max-width:1000px;
            margin:30px auto;
            padding:30px;
            border-radius:20px;
            box-shadow:0 4px 20px rgba(0,0,0,.08);
        }

.cron-display{
    width:100%;
    box-sizing:border-box;
    border:2px solid #dbeafe;
    background:#f8fbff;
    border-radius:15px;
    padding:35px;
    text-align:center;
    font-size:42px;
    font-weight:bold;
    color:#0f172a;
    outline:none;
}

.cron-display:focus{
    border-color:#2563eb;
    box-shadow:0 0 10px rgba(37,99,235,.2);
}

        .cron-fields{
            display:grid;
            grid-template-columns:repeat(5,1fr);
            margin-top:10px;
            text-align:center;
            color:#6b7280;
            font-size:14px;
        }

        select{
            width:250px;
            padding:12px;
            border-radius:10px;
            border:1px solid #d1d5db;
        }

        .btn{
            background:#2563eb;
            color:white;
            border:none;
            padding:12px 25px;
            border-radius:10px;
            cursor:pointer;
            margin-top:15px;
        }

        .btn:hover{
            background:#1d4ed8;
        }

        .valid{
            margin-top:20px;
            color:#059669;
            font-weight:600;
        }

        .info-box{
            margin-top:25px;
            padding:15px;
            background:#ecfdf5;
            border-left:5px solid #10b981;
            border-radius:8px;
            font-size:18px;
            color:#065f46;
        }

        .run-cards{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            margin-top:15px;
        }

        .run-card{
            background:#eef2ff;
            padding:15px;
            border-radius:10px;
            min-width:180px;
            text-align:center;
        }

        .copy-btn{
            float:right;
        }

    </style>
</head>

<body>

<div class="cron-card">

    <h2>Cron Expression Generator</h2>

    <label>
        Frequency
    </label>

    <br>

    <select id="schedule">
        <option value="minute">Every Minute</option>
        <option value="hour">Every Hour</option>
        <option value="day">Every Day</option>
        <option value="week">Every Sunday</option>
        <option value="month">First Day Of Month</option>
    </select>

    <button
        class="btn"
        onclick="generateCron()"
    >
        Generate
    </button>

    <button
        class="btn copy-btn"
        onclick="copyCron()"
    >
        Copy Expression
    </button>

    <br><br>

<input
    type="text"
    id="cronOutput"
    class="cron-display"
    value="* * * * *"
    oninput="cronEdited()"
/>

    <div class="cron-fields">
        <div>Minute</div>
        <div>Hour</div>
        <div>Day of Month</div>
        <div>Month</div>
        <div>Day of Week</div>
    </div>

    <div id="valid" class="valid">
        ✅ Valid Linux cron expression
    </div>

    <div
        class="info-box"
        id="cronDescription"
    >
        Runs every minute.
    </div>

    <h3 style="margin-top:30px;">
        Next 5 Scheduled Runs
    </h3>

    <div
        class="run-cards"
        id="nextRuns"
    >
    </div>

</div>

<script>

function generateCron(){

    let cron="";
    let description="";

    const schedule =
        document.getElementById("schedule").value;

    if(schedule==="minute"){
        cron="* * * * *";
        description="Runs every minute";
    }

    else if(schedule==="hour"){
        cron="0 * * * *";
        description="Runs at beginning of every hour";
    }

    else if(schedule==="day"){
        cron="0 0 * * *";
        description="Runs every day at midnight";
    }

    else if(schedule==="week"){
        cron="0 0 * * 0";
        description="Runs every Sunday";
    }

    else if(schedule==="month"){
        cron="0 0 1 * *";
        description="Runs on first day of month";
    }

    document.getElementById(
        "cronOutput"
    ).value = cron;

    document.getElementById(
        "cronDescription"
    ).innerHTML = explainCron(cron);



}

function generateRuns(){

    const container =
        document.getElementById("nextRuns");

    container.innerHTML="";

    let now=new Date();

    for(let i=1;i<=5;i++){

        let next =
            new Date(
                now.getTime() +
                (i*60000)
            );

        let card =
            document.createElement("div");

        card.className =
            "run-card";

        card.innerHTML =
            next.toLocaleString();

        container.appendChild(card);
    }
}

function copyCron(){

    const cron =
        document.getElementById(
            "cronOutput"
        ).value;

    navigator.clipboard.writeText(cron);

    alert(
        "Cron copied!"
    );
}

function cronEdited(){

    const cron =
        document.getElementById(
            "cronOutput"
        ).value.trim();

    const fields =
        cron.split(/\s+/);

    const valid =
        document.getElementById("valid");


    if(fields.length === 5){

        valid.innerHTML =
            "✅ Valid Linux cron expression";

        valid.style.color =
            "#059669";

        document.getElementById(
            "cronDescription"
        ).innerHTML =
            explainCron(cron);

        generateRuns();
    }
    else{

        valid.innerHTML =
            "❌ Invalid cron expression";

        valid.style.color =
            "red";
    }

}

function explainCron(cron){

    const fields = cron.split(/\s+/);

    if(fields.length !== 5){
        return "Invalid cron expression";
    }

    return `
        Matches minute <b>${fields[0]}</b>,
        hour <b>${fields[1]}</b>,
        day-of-month <b>${fields[2]}</b>,
        month <b>${fields[3]}</b>,
        day-of-week <b>${fields[4]}</b>.
    `;
}

generateCron();

</script>

</body>
</html>
