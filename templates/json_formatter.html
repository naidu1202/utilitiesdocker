<!DOCTYPE html>
<html>
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>JSON Formatter & Validator Online Free | UtilitiesDocker</title>

    <meta
        name="description"
        content="Free online JSON formatter, validator and minifier. Beautify JSON, validate syntax and compress JSON data instantly."
    >

    <meta
        name="keywords"
        content="json formatter,json validator,json beautifier,json minifier,online json formatter"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta property="og:title"
          content="JSON Formatter & Validator Online Free">

    <meta property="og:description"
          content="Beautify, validate and minify JSON instantly online.">

    <meta property="og:type"
          content="website">

    <style>
        body {
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
            overflow-x: auto;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }
    </style>

</head>

<body>

<h1>JSON Formatter</h1>

<p>
Paste JSON below to beautify and validate.
</p>

<textarea id="jsonInput" placeholder="Paste JSON here..."></textarea>

<br>

<button onclick="formatJson()">Format JSON</button>
<button onclick="minifyJson()">Minify JSON</button>
<button onclick="copyJson()">Copy Result</button>

<div id="status"></div>

<pre id="result"></pre>

<script>

function formatJson() {

    const input =
        document.getElementById("jsonInput").value;

    try {

        const obj = JSON.parse(input);

        const formatted =
            JSON.stringify(obj, null, 4);

        document.getElementById("result").textContent =
            formatted;

        document.getElementById("status").innerHTML =
            "<span class='success'>✅ Valid JSON</span>";

    } catch (err) {

        document.getElementById("status").innerHTML =
            "<span class='error'>❌ Invalid JSON<br>" +
            err.message +
            "</span>";

        document.getElementById("result").textContent = "";
    }
}

function minifyJson() {

    const input =
        document.getElementById("jsonInput").value;

    try {

        const obj = JSON.parse(input);

        document.getElementById("result").textContent =
            JSON.stringify(obj);

        document.getElementById("status").innerHTML =
            "<span class='success'>✅ JSON Minified</span>";

    } catch (err) {

        document.getElementById("status").innerHTML =
            "<span class='error'>❌ Invalid JSON<br>" +
            err.message +
            "</span>";
    }
}

function copyJson() {

    const text =
        document.getElementById("result").textContent;

    navigator.clipboard.writeText(text);

    alert("Copied to clipboard!");
}

</script>

</body>
</html>
