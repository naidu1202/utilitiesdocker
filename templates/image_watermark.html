{% extends "base.html" %}

{% block title %}
Image Watermark
{% endblock %}

{% block content %}

<div class= "tool-container">

    <h1>💧 Image Watermark</h1>

    <p>
        Upload an image and add a custom text watermark.
    </p>

    <form
        action="/image-watermark"
        method="post"
        enctype="multipart/form-data">

        <input
            type="file"
            name="file"
            accept="image/*"
            required>

        <br><br>

        <input
            type="text"
            name="watermark"
            placeholder="Enter watermark text"
            required
            style="width:100%;padding:10px;">

        <br><br>

        <button type="submit">
            Add Watermark
        </button>

    </form>

</div>

{% endblock %}
