{% extends "base.html" %}

{% block title %}Exchange Rate Converter{% endblock %}

{% block content %}

<div class="tool-page">

    <h1>💱 Exchange Rate Converter</h1>

    <p>
        Convert currencies using the latest exchange rates.
    </p>

    <form id="currencyForm">

        <label>Amount</label>
        <input
            type="number"
            id="amount"
            value="1"
            min="0"
            step="0.01"
            required>

        <br><br>

        <label>From Currency</label>
        <select id="fromCurrency">
            <option value="USD">USD - US Dollar</option>
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="AUD">AUD - Australian Dollar</option>
            <option value="INR">INR - Indian Rupee</option>
            <option value="CNY">CNY - Chinese Yuan</option>
        </select>

        <br><br>

        <label>To Currency</label>
        <select id="toCurrency">
            <option value="SGD">SGD - Singapore Dollar</option>
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="JPY">JPY - Japanese Yen</option>
            <option value="AUD">AUD - Australian Dollar</option>
            <option value="INR">INR - Indian Rupee</option>
            <option value="CNY">CNY - Chinese Yuan</option>
        </select>

        <br><br>

        <button
            type="button"
            class="tool-btn"
            onclick="convertCurrency()">

            Convert

        </button>

    </form>

    <div
        id="result"
        class="result-box"
        style="margin-top:20px;">
    </div>

</div>

<script>

async function convertCurrency() {

    const amount =
        document.getElementById("amount").value;

    const from =
        document.getElementById("fromCurrency").value;

    const to =
        document.getElementById("toCurrency").value;

    try {

        const response = await fetch(
            `https://api.exchangerate-api.com/v4/latest/${from}`
        );

        const data = await response.json();

        const rate = data.rates[to];

        const converted =
            (amount * rate).toFixed(2);

        document.getElementById("result").innerHTML =
            `<h3>${amount} ${from} = ${converted} ${to}</h3>`;

    } catch (error) {

        document.getElementById("result").innerHTML =
            "<span class='error'>Unable to fetch exchange rates.</span>";

    }
}

</script>

{% endblock %}
