{% extends "base.html" %}

{% block title %}
Photo to Video
{% endblock %}

{% block content %}

<div class="tool-box">

    <h1>📸 Photo To Video</h1>

    <p>
        Create an MP4 slideshow from your photos.
    </p>

    <form
        action="/photo-to-video"
        method="post"
        enctype="multipart/form-data"
        id="photoForm">

        <div class="upload-box">

            <h3>📷 Select Photos</h3>

            <input
                type="file"
                name="files"
                accept="image/*"
                multiple
                required>

        </div>

        <br>

        <button
            type="submit"
            class="btn-primary">

            🎬 Create Video

        </button>

    </form>

    <div
        id="processingMessage"
        class="message"
        style="display:none;">
    </div>

</div>

<style>

.tool-box{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #d1d5db;
    padding:40px;
    text-align:center;
    border-radius:10px;
    background:#f9fafb;
}

.btn-primary{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 22px;
    border-radius:8px;
    cursor:pointer;
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}

</style>

<script>

document.getElementById(
    "photoForm"
).addEventListener(
    "submit",
    function(){

        const msg =
            document.getElementById(
                "processingMessage"
            );

        msg.style.display = "block";

        msg.style.background =
            "#dbeafe";

        msg.style.color =
            "#1e40af";

        msg.innerHTML =
            "⏳ Creating slideshow video... Please wait.";

        setTimeout(function(){

            msg.style.background =
                "#dcfce7";

            msg.style.color =
                "#166534";

            msg.innerHTML =
                "✅ Video Created Successfully. Download should start automatically.";

        }, 5000);

    }
);

</script>

{% endblock %}
