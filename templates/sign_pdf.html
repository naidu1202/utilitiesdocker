<!DOCTYPE html>
<html>
<head>

<title>
Sign PDF
</title>

<link
rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div class="container">

<h1>
✍️ Sign PDF
</h1>

<form
action="/sign-pdf"
method="post"
enctype="multipart/form-data">

PDF File

<input
type="file"
name="pdf_file"
accept=".pdf"
required>

<br><br>

Signature PNG

<input
type="file"
name="signature_file"
accept=".png"
required>

<br><br>

<button type="submit">
Sign PDF
</button>

</form>

</div>

</body>
</html>
