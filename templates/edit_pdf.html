<!DOCTYPE html>
<html>
<head>

<title>
Edit PDF
</title>

<link
rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div class="container">

<h1>
✏️ Edit PDF
</h1>

<form
action="/edit-pdf"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".pdf"
required>

<br><br>

<input
type="text"
name="find_text"
placeholder="Text to find"
required>

<br><br>

<input
type="text"
name="replace_text"
placeholder="Replacement text"
required>

<br><br>

<button type="submit">
Edit PDF
</button>

</form>

</div>

</body>
</html>
