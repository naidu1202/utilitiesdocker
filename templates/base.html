<!DOCTYPE html>
<html lang="en">
<head>
<link rel="canonical" href="https://utilitiesdocker.com{{ request.url.path }}">      

<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-WNZSDR54"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>

    <title>
        {% block title %}
        Free PDF, Image, Video & AI Tools | UtilitiesDocker
        {% endblock %}
    </title>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="description"
          content="{% block meta_description %}
          Free online PDF, image, video and developer tools. Merge PDFs, compress files, remove backgrounds, format JSON and generate QR codes.
          {% endblock %}">

    <meta name="robots"
          content="index,follow">

    <meta name="author"
          content="UtilitiesDocker">


    <!-- Open Graph -->
    <meta property="og:title"
          content="{% block og_title %}
          UtilitiesDocker
          {% endblock %}">

    <meta property="og:description"
          content="{% block og_description %}
          Free online PDF, Image, Audio, Video, SEO and Developer Tools.
          {% endblock %}">

    <meta property="og:type"
          content="website">

      <meta property="og:url"
            content="https://utilitiesdocker.com{{ request.url.path }}">

    <!-- Twitter -->
    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="{% block twitter_title %}
          UtilitiesDocker
          {% endblock %}">

    <meta name="twitter:description"
          content="{% block twitter_description %}
          Free online utilities and conversion tools.
          {% endblock %}">

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<header class="tool-header">
    <a href="/" class="back-btn">
        ← Back
    </a>
</header>

<div class="container">
{% block content %}
{% endblock %}
</div>

<br><br><br><br><br>

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/static/service-worker.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Failed', err));
    });
}
</script>

</body>
</html>
