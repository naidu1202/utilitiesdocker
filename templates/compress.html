{% extends "base.html" %}

{% block title %}
Compress PDF
{% endblock %}

{% block content %}

<div class= "tool-container">

    <h1>🗜️ Compress PDF</h1>

    <p>
        Reduce PDF file size while maintaining good quality.
    </p>

    <form
        action="/compress"
        method="post"
        enctype="multipart/form-data">

        <label>Select PDF File</label>

        <input
            type="file"
            name="file"
            accept=".pdf"
            required>

        <br><br>

        <label>Compression Level</label>

        <select name="quality">
            <option value="screen">Maximum Compression</option>
            <option value="ebook" selected>Balanced</option>
            <option value="prepress">High Quality</option>
        </select>

        <br><br>

        <button type="submit">
            Compress PDF
        </button>

    </form>

    <br>



</div>

{% endblock %}
