{% extends "base.html" %}

{% block title %}HEIC to JPG Converter{% endblock %}

{% block content %}

<h2>HEIC to JPG Converter</h2>

<p>
Convert iPhone HEIC photos to JPG format instantly.
</p>

<form action="/heic-to-jpg"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".heic,.heif"
           required>

    <br><br>

    <button type="submit">
        Convert to JPG
    </button>

</form>

{% endblock %}
