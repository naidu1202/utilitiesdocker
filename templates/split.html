{% extends "base.html" %}

{% block title %}
Merge PDF
{% endblock %}

{% block content %}

<div class="tool-container">

     <h1>📄 Split PDF</h1>

<p>Split a PDF at a specific page.</p>

<form action="/split" method="post" enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".pdf"
           required>

    <br><br>

    <input
        type="number"
        name="page"
        placeholder="Page Number"
        min="1"
        required>

    <br><br>

    <button type="submit">
        Split PDF
    </button>

</form>

<br>



</div>

{% endblock %}
