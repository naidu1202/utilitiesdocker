{% extends "base.html" %}

{% block title %}
Extract Pages
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>📑 Extract Pages</h1>

<form action="/extract-pages"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="file"
       required>

<br><br>

<input type="text"
       name="pages"
       placeholder="1,3,5"
       required>

<br><br>

<button type="submit">
Extract
</button>

</form>

</div>

{% endblock %}
