<!DOCTYPE html>
<html>
<head>
<title>Extract Pages</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">

<h1>📑 Extract Pages</h1>

<form action="/extract-pages"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="file"
       required>

<br><br>

<input type="text"
       name="pages"
       placeholder="1,3,5"
       required>

<br><br>

<button type="submit">
Extract
</button>

</form>

</div>

</body>
</html>
