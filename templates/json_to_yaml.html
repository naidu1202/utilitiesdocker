{% extends "base.html" %}

{% block title %}JSON to YAML Converter{% endblock %}

{% block content %}

<div class="tool-container">

<h2>📊 JSON to YAML Converter</h2>

<form action="/json-to-yaml" method="post" enctype="multipart/form-data">

    <button type="submit">Convert</button>
</form>

</div>

{% endblock %}
