<!DOCTYPE html>
<html>
<head>

<title>PDF Watermark</title>

<link rel="stylesheet"
      href="/static/style.css">

</head>

<body>

<div class="container">

<h1>💧 PDF Watermark</h1>

<form
action="/pdf-watermark"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".pdf"
required>

<br><br>

<input
type="text"
name="watermark"
placeholder="CONFIDENTIAL"
required>

<br><br>

<button type="submit">
Add Watermark
</button>

</form>

</div>

</body>
</html>
