{% extends "base.html" %}

{% block title %}
PDF Watermark
{% endblock %}

{% block content %}

<div class= "tool-container">

<h1>💧 PDF Watermark</h1>

<form
action="/pdf-watermark"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".pdf"
required>

<br><br>

<input
type="text"
name="watermark"
placeholder="CONFIDENTIAL"
required>

<br><br>

<button type="submit">
Add Watermark
</button>

</form>

</div>

{% endblock %}
