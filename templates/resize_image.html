<!DOCTYPE html>
<html>
<head>
    <title>Resize Image</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>📏 Resize Image</h1>

<form
    action="/resize-image"
    method="post"
    enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept="image/*"
        required>

    <br><br>

    <input
        type="number"
        name="width"
        placeholder="Width"
        required>

    <br><br>

    <input
        type="number"
        name="height"
        placeholder="Height"
        required>

    <br><br>

    <button type="submit">
        Resize Image
    </button>

</form>

</div>

</body>
</html>
