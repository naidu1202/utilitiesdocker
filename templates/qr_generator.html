<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Free QR Code Generator | UtilitiesDocker</title>

<meta name="description"
content="Generate QR codes online for free. Create QR codes for URLs, WiFi, text, emails and more.">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<style>

body{
    max-width:800px;
    margin:auto;
    padding:20px;
    font-family:Arial,sans-serif;
}

textarea{
    width:100%;
    height:120px;
    padding:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
}

    background:#1d4ed8;

<body>

<h1>Free QR Code Generator</h1>

<p>

</p>

<form action="/generate-qr" method="post">

<textarea
name="content"
placeholder="Enter URL or text"></textarea>

<br><br>

<button type="submit">
Generate QR Code
</button>

</form>

</body>
</html>
