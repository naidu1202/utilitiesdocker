{% extends "base.html" %}

{% block title %}
OCR PDF
{% endblock %}

{% block content %}

<div class= "tool-container">

<h2>🔍 OCR PDF</h2>

<p>
Extract text from scanned PDF documents.
</p>

<form
    action="/ocr-pdf"
    method="post"
    enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept=".pdf"
        required>

    <br><br>

    <button type="submit">
        Extract Text
    </button>

</form>

</div>

{% endblock %}
