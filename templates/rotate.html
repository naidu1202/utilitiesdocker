{% extends "base.html" %}

{% block title %}
Rotate PDF
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>🔄 Rotate PDF</h1>

<form action="/rotate"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="file"
       required>

<br><br>

<select name="degrees">

    <option value="90">90°</option>
    <option value="180">180°</option>
    <option value="270">270°</option>

</select>

<br><br>

<button type="submit">
Rotate
</button>

</form>

</div>

{% endblock %}
