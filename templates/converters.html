{% extends "base.html" %}

{% block content %}

<h1>🔄 Universal Unit Converter</h1>

<div class="tool-container">

    <label>Category</label>
    <select id="category" onchange="updateUnits()">
<option value="weight">⚖️ Weight</option>
<option value="length">📏 Length</option>
<option value="temperature">🌡️ Temperature</option>
<option value="volume">💧 Volume</option>
<option value="data">💾 Data</option>
    </select>

    <br><br>

    <label>From</label>
    <select id="fromUnit"></select>

    <br><br>

    <label>To</label>
    <select id="toUnit"></select>

    <br><br>

    <label>Value</label>
    <input type="number" id="inputValue">

    <br><br>

    <button onclick="convertUnit()">Convert</button>

    <h2 id="result"></h2>

</div>

<script>

const units = {

    weight: {
        Kilogram: 1,
        Gram: 0.001,
        Pound: 0.45359237,
        Ounce: 0.0283495,
        Ton: 1000
    },

    length: {
        Millimeter: 0.001,
        Centimeter: 0.01,
        Meter: 1,
        Kilometer: 1000,
        Inch: 0.0254,
        Foot: 0.3048,
        Mile: 1609.344
    },

    volume: {
        Milliliter: 0.001,
        Liter: 1,
        Gallon: 3.78541,
        Ounce: 0.0295735
    },

    data: {
        Byte: 1,
        KB: 1024,
        MB: 1048576,
        GB: 1073741824,
        TB: 1099511627776
    }

};

function updateUnits() {

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit");

    const to =
        document.getElementById("toUnit");

    from.innerHTML = "";
    to.innerHTML = "";

    if (category === "temperature") {

        ["Celsius", "Fahrenheit", "Kelvin"]
            .forEach(unit => {

                from.innerHTML +=
                    `<option value="${unit}">${unit}</option>`;

                to.innerHTML +=
                    `<option value="${unit}">${unit}</option>`;
            });

    } else {

        Object.keys(units[category])
            .forEach(unit => {

                from.innerHTML +=
                    `<option value="${unit}">${unit}</option>`;

                to.innerHTML +=
                    `<option value="${unit}">${unit}</option>`;
            });
    }

    if (to.options.length > 1) {
        to.selectedIndex = 1;
    }

    convertUnit();
}

function convertTemperature(value, from, to) {

    if (from === to) return value;

    if (from === "Celsius") {

        if (to === "Fahrenheit")
            return (value * 9 / 5) + 32;

        if (to === "Kelvin")
            return value + 273.15;
    }

    if (from === "Fahrenheit") {

        if (to === "Celsius")
            return (value - 32) * 5 / 9;

        if (to === "Kelvin")
            return ((value - 32) * 5 / 9) + 273.15;
    }

    if (from === "Kelvin") {

        if (to === "Celsius")
            return value - 273.15;

        if (to === "Fahrenheit")
            return ((value - 273.15) * 9 / 5) + 32;
    }
}

function convertUnit() {

    const category =
        document.getElementById("category").value;

    const from =
        document.getElementById("fromUnit").value;

    const to =
        document.getElementById("toUnit").value;

    const value =
        parseFloat(
            document.getElementById("inputValue").value
        );

    if (isNaN(value)) {

        document.getElementById("result").innerHTML = "";
        return;
    }

    let result;

    if (category === "temperature") {

        result =
            convertTemperature(
                value,
                from,
                to
            );

    } else {

        const baseValue =
            value * units[category][from];

        result =
            baseValue /
            units[category][to];
    }

    document.getElementById("result").innerHTML =
        `
        ${value} ${from}
        <br>
        =
        <br>
        <strong>${result.toLocaleString(undefined, {
            maximumFractionDigits: 8
        })} ${to}</strong>
        `;
}

document.getElementById("fromUnit")
    .addEventListener("change", convertUnit);

document.getElementById("toUnit")
    .addEventListener("change", convertUnit);

document.getElementById("inputValue")
    .addEventListener("input", convertUnit);

updateUnits();

</script>

{% endblock %}
