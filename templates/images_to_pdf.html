<!DOCTYPE html>
<html>
<head>
<title>Images To PDF</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">

<h1>🖼️ Images To PDF</h1>

<form action="/images-to-pdf"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="files"
       multiple
       accept="image/*"
       required>

<br><br>

<button type="submit">
Convert To PDF
</button>

</form>

</div>

</body>
</html>
