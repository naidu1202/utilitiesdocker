{% extends "base.html" %}

{% block title %}
Merge PDF
{% endblock %}

{% block content %}

<div class="tool-container">


<h1>🖼️ Images To PDF</h1>

<form action="/images-to-pdf"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="files"
       multiple
       accept="image/*"
       required>

<br><br>

<button type="submit">
Convert To PDF
</button>

</form>

</div>

{% endblock %}
