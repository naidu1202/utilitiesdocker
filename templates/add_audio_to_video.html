{% extends "base.html" %}

{% block title %}
Add Audio To Video
{% endblock %}

{% block content %}

<div class="tool-box">

    <h1>🎧 Add Audio To Video</h1>

    <p>
        Add music, voice recordings or MP3 files to your video.
    </p>

    <form
        action="/add-audio-to-video"
        method="post"
        enctype="multipart/form-data"
        id="audioVideoForm">

        <div class="upload-box">

            <h3>📹 Select Video</h3>

            <input
                type="file"
                name="video"
                accept="video/*"
                required>

        </div>

        <br>

        <div class="upload-box">

            <h3>🎵 Select Audio</h3>

            <input
                type="file"
                name="audio"
                accept=".mp3,.wav,.aac,.m4a"
                required>

        </div>

        <br>

        <button
            type="submit"
            class="btn-primary">

            🎧 Add Audio

        </button>

    </form>

    <div
        id="processingMessage"
        class="message"
        style="display:none;">
    </div>

</div>

<style>

.tool-box{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #d1d5db;
    padding:30px;
    border-radius:10px;
    background:#f9fafb;
}

.btn-primary{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

.btn-primary:hover{
    background:#4338ca;
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}

</style>

<script>

document.getElementById(
    "audioVideoForm"
).addEventListener(
    "submit",
    function(){

        const msg =
            document.getElementById(
                "processingMessage"
            );

        msg.style.display = "block";

        msg.style.background =
            "#dbeafe";

        msg.style.color =
            "#1e40af";

        msg.innerHTML =
            "⏳ Adding Audio To Video... Please wait.";

        setTimeout(function(){

            msg.style.background =
                "#dcfce7";

            msg.style.color =
                "#166534";

            msg.innerHTML =
                "✅ Video Created Successfully. Download should start automatically.";

        }, 4000);

    }
);

</script>

{% endblock %}
