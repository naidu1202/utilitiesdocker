<!DOCTYPE html>
<html>
<head>
    <title>Merge PDF</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h1>Merge PDF Files</h1>

<p>Combine multiple PDF files into one document.</p>

<form action="/merge" method="post" enctype="multipart/form-data">

    <input type="file"
           name="files"
           multiple
           accept=".pdf"
           required>

    <br><br>

    <button type="submit">
        Merge PDFs
    </button>

</form>

<br>

<a href="/">← Back Home</a>

</body>
</html>
