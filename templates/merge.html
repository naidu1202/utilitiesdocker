{% extends "base.html" %}

{% block title %}
Merge PDF
{% endblock %}

{% block content %}

<div class="tool-container">

    <h1>📄 Merge PDF</h1>

    <p>
        Combine multiple PDF files into one document.
    </p>

    <form
        action="/merge"
        method="post"
        enctype="multipart/form-data">

        <input
            type="file"
            name="files"
            multiple
            required>

        <button type="submit">
            Merge PDF Files
        </button>

    </form>

</div>

{% endblock %}
