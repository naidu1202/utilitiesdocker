{% extends "base.html" %}

{% block title %}
WEBP to JPG Converter
{% endblock %}

{% block content %}

<h2>WEBP to JPG Converter</h2>

<form action="/webp-to-jpg"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".webp"
           required>

    <button type="submit">
        Convert
    </button>

</form>

{% endblock %}
