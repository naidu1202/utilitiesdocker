<!DOCTYPE html>
<html>
<head>

<title>Compress Image Online Free | UtilitiesDocker</title>

<meta name="description"
content="Compress JPG and PNG images online for free. Reduce image size while maintaining quality.">

<style>

body{
    max-width:800px;
    margin:auto;
    padding:20px;
    font-family:Arial;
}

button{
    padding:12px 20px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
}

</style>

</head>
<body>

<h1>Compress Image</h1>

<p>
Reduce JPG and PNG image size instantly.
</p>

<form
action="/compress-image"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".jpg,.jpeg,.png"
required>

<br><br>

<button type="submit">
Compress Image
</button>

</form>

</body>
</html>
