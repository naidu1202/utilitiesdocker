<!DOCTYPE html>
<html>
<head>
    <title>Unlock PDF</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>🔓 Unlock PDF</h1>

<form
    action="/unlock-pdf"
    method="post"
    enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept=".pdf"
        required>

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="PDF Password"
        required>

    <br><br>

    <button type="submit">
        Unlock PDF
    </button>

</form>

</div>

</body>
</html>
