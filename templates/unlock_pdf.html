{% extends "base.html" %}

{% block title %}
Unlock PDF
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>🔓 Unlock PDF</h1>

<form
    action="/unlock-pdf"
    method="post"
    enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept=".pdf"
        required>

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="PDF Password"
        required>

    <br><br>

    <button type="submit">
        Unlock PDF
    </button>

</form>

</div>


{% endblock %}
