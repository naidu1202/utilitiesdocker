{% extends "base.html" %}

{% block title %}
PowerPoint To PDF
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>
📊 PowerPoint To PDF
</h1>

<form
action="/powerpoint-to-pdf"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".ppt,.pptx"
required>

<br><br>

<button type="submit">
Convert To PDF
</button>

</form>

</div>


{% endblock %}
