<!DOCTYPE html>
<html>
<head>

<title>
PowerPoint To PDF
</title>

<link
rel="stylesheet"
href="/static/style.css">

</head>

<body>

<div class="container">

<h1>
📊 PowerPoint To PDF
</h1>

<form
action="/powerpoint-to-pdf"
method="post"
enctype="multipart/form-data">

<input
type="file"
name="file"
accept=".ppt,.pptx"
required>

<br><br>

<button type="submit">
Convert To PDF
</button>

</form>

</div>

</body>
</html>
