{% extends "base.html" %}

{% block title %}
PDF To JPG
{% endblock %}

{% block content %}

<div class="tool-container">

<h1>📸 PDF To JPG</h1>

<form action="/pdf-to-jpg"
      method="post"
      enctype="multipart/form-data">

<input type="file"
       name="file"
       accept=".pdf"
       required>

<br><br>

<button type="submit">
Convert
</button>

</form>

</div>

{% endblock %}
