<!DOCTYPE html>
<html>
<head>
    <title>Image Converter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h1>🔄 Image Converter</h1>

<form
    action="/image-converter"
    method="post"
    enctype="multipart/form-data">

    <input
        type="file"
        name="file"
        accept="image/*"
        required>

    <br><br>

    <select
        name="output_format"
        required>

        <option value="jpg">
            JPG
        </option>

        <option value="png">
            PNG
        </option>

        <option value="webp">
            WEBP
        </option>

        <option value="bmp">
            BMP
        </option>

    </select>

    <br><br>

    <button type="submit">
        Convert Image
    </button>

</form>

</div>

</body>
</html>
