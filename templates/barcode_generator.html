{% extends "base.html" %}

{% block title %}
Barcode Generator
{% endblock %}

{% block content %}

<div class= "tool-container">

<h1>
🏷️ Barcode Generator
</h1>

<form
action="/generate-barcode"
method="post">

<input
type="text"
name="content"
placeholder="123456789"
required>

<br><br>

<button type="submit">
Generate Barcode
</button>

</form>

</div>

{% endblock %}
