{% extends "base.html" %}

{% block title %}
Excel to PDF
{% endblock %}

{% block content %}

<div class= "tool-container">

<h2>Excel to PDF</h2>

<form action="/excel-to-pdf"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".doc,.docx"
           required>

    <button type="submit">
        Convert
    </button>

</form>

{% endblock %}
