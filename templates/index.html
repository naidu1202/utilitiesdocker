<!DOCTYPE html>
<html>
<head>
    <title>PDF Tools</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>

    <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>PDF Merge & Split</h1>
        <a href="javascript:void(0)"
        class="feedback-btn"
        onclick="openFeedback()">
            🛠️ Help Improve UtilitiesDocker
        </a>
    </div>

    <h2>Merge PDF</h2>

    <form action="/merge" method="post" enctype="multipart/form-data">
        <input type="file" name="files" multiple accept=".pdf" required>
        <button type="submit">Merge</button>
    </form>

    <hr>

    <h2>Split PDF</h2>

    <form action="/split" method="post" enctype="multipart/form-data">
        <input type="file" name="file" accept=".pdf" required>
        <input type="number" name="page" placeholder="Page Number" min="1" required>
        <button type="submit">Split</button>
    </form>

<div id="feedbackModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeFeedback()">&times;</span>

        <h2>🛠️ Help Improve UtilitiesDocker</h2>

        <form action="/feedback" method="post">

            <label>Feedback Type</label>

            <select name="feedback_type" required>
                <option value="">Select</option>
                <option>General Feedback</option>
                <option>Report a Bug</option>
                <option>Suggest a Tool</option>
                <option>Feature Request</option>
            </select>

            <br><br>

            <label>Your Feedback</label>

            <textarea
                name="message"
                rows="5"
                placeholder="Tell us what you think..."
                required></textarea>

            <br><br>

            <label>Email (Optional)</label>

            <input
                type="email"
                name="email"
                placeholder="your@email.com">

            <br><br>

            <button type="submit">
                Submit Feedback
            </button>

        </form>

    </div>

</div>

<script>

function openFeedback() {
    document.getElementById("feedbackModal").style.display = "block";
}

function closeFeedback() {
    document.getElementById("feedbackModal").style.display = "none";
}

window.addEventListener("click", function(event) {
    const modal = document.getElementById("feedbackModal");

    if (event.target === modal) {
        modal.style.display = "none";
    }
});

</script>

</body>
</html>
