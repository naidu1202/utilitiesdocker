{% extends "base.html" %}

{% block title %}PDF to Word{% endblock %}

{% block content %}
<h2>PDF to Word</h2>

<form action="/pdf-to-word"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".pdf"
           required>

    <button type="submit">
        Convert
    </button>

</form>

{% endblock %}
