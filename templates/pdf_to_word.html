{% extends "base.html" %}

{% block title %}PDF to Word{% endblock %}

{% block content %}


<div class="tool-container">
 <h1> PDF to Word</h1>
<form action="/pdf-to-word"
      method="post"
      enctype="multipart/form-data">

    <input type="file"
           name="file"
           accept=".pdf"
           required>

    <button type="submit">
        Convert
    </button>

</form>
</div>

{% endblock %}
