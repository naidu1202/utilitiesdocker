{% extends "base.html" %}

{% block title %}CSV to JSON Converter{% endblock %}

{% block content %}

<div class="tool-page">

    

    <h1>📊 CSV to JSON Converter</h1>

    <p>
        Upload a CSV file and convert it to JSON format instantly.
    </p>

    <form
        action="/csv-to-json"
        method="post"
        enctype="multipart/form-data">

        <div class="upload-box">

            <input
                type="file"
                name="file"
                accept=".csv"
                required>

        </div>

        <button
            type="submit"
            class="tool-btn">

            Convert to JSON

        </button>

    </form>

</div>

{% endblock %}
