{% extends "base.html" %}

{% block title %}
Compress Video
{% endblock %}

{% block content %}

<div class="tool-box">

    <h1>🗜️ Compress Video</h1>

    <p>
        Reduce video file size while maintaining quality.
    </p>

    <form
        action="/video-compressor"
        method="post"
        enctype="multipart/form-data"
        id="compressForm">

        <div class="upload-box">

            <p>
                📹 Select Video File
            </p>

            <input
                type="file"
                name="file"
                accept="video/*"
                required>

     *  </div>

        <br>

        <l*bel>
            Compression Level*        </label>

        <select
*           name="quality"
        *   class="form-control">

        *   <option value="high">
         *      High Quality
            </o*tion>

            <option value="*alanced">
                Balanced*            </option>

           *<option value="max">
                Maximum Compression
            </option>

        </select>

        <br>

        <button
            type="submit"
            class="btn-primary">

            🗜️ Compress Video

        </button>

    </form>

    <div
        id="processingMessage"
        class="message"
        style="display:none;">
    </div>

</div>

<style>

.tool-box{
    max-width:800px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #d1d5db;
    padding:40px;
    text-align:center;
    border-radius:10px;
    background:#f9fafb;
}

.form-control{
    width:100%;
    padding:10px;
    border:1px solid #ddd;
    border-radius:6px;
}

.btn-primary{
    background:#4f46e5;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
}

.btn-primary:hover{
    background:#4338ca;
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:8px;
    font-weight:bold;
}

</style>

<script>

document.getElementById(
    "compressForm"
).addEventListener(
    "submit",
    function(){

        const msg =
            document.getElementById(
                "processingMessage"
            );

        msg.style.display = "block";

        msg.style.background =
            "#dbeafe";

        msg.style.color =
            "#1e40af";

        msg.innerHTML =
            "⏳ Compressing Video... Please wait.";

        setTimeout(function(){

            msg.style.background =
                "#dcfce7";

            msg.style.color =
                "#166534";

            msg.innerHTML =
                "✅ Video Compressed Successfully. Download should start automatically.";

        }, 5000);

    }
);

</script>

{% endblock %}
